<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="간단하고 안전한 수업 만족도 조사 웹앱"
    />
    <meta name="theme-color" content="#f6f7fb" />
    <title>CLASS FEEDBACK</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/config.js" defer></script>
    <script src="/vendor/supabase.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="CLASS FEEDBACK 홈">
        <span class="brand-mark" aria-hidden="true">CF</span>
        <span>CLASS FEEDBACK</span>
      </a>
      <button id="open-login-button" class="button button-quiet" type="button">
        관리자 로그인
      </button>
    </header>

    <main>
      <section id="student-view" class="view" aria-labelledby="question-title">
        <div class="survey-card">
          <p class="eyebrow">TODAY'S CLASS</p>
          <h1 id="question-title">오늘 수업은 어땠나요?</h1>
          <p class="supporting-text">가장 가까운 느낌을 하나 선택해 주세요.</p>

          <div id="rating-buttons" class="rating-grid" aria-label="수업 만족도 선택">
            <button class="rating-button rating-satisfied" type="button" data-rating="satisfied">
              <span class="rating-emoji" aria-hidden="true">😊</span>
              <span>만족</span>
            </button>
            <button class="rating-button rating-neutral" type="button" data-rating="neutral">
              <span class="rating-emoji" aria-hidden="true">😐</span>
              <span>보통</span>
            </button>
            <button class="rating-button rating-dissatisfied" type="button" data-rating="dissatisfied">
              <span class="rating-emoji" aria-hidden="true">😞</span>
              <span>불만족</span>
            </button>
          </div>

          <p id="vote-message" class="status-message" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section id="admin-view" class="view" aria-labelledby="dashboard-title" hidden>
        <div class="dashboard-shell">
          <div class="dashboard-heading">
            <div>
              <p class="eyebrow">ADMIN DASHBOARD</p>
              <h1 id="dashboard-title">수업 만족도 결과</h1>
              <p id="last-updated" class="supporting-text">결과를 불러오는 중입니다.</p>
            </div>
            <div class="dashboard-actions">
              <button id="refresh-button" class="button button-secondary" type="button">결과 새로고침</button>
              <button id="reset-button" class="button button-danger" type="button">투표 결과 초기화</button>
              <button id="logout-button" class="button button-quiet" type="button">로그아웃</button>
            </div>
          </div>

          <div class="summary-card" aria-label="전체 투표 수">
            <span>전체 투표</span>
            <strong id="total-count">0</strong>
            <span>명</span>
          </div>

          <div class="result-grid">
            <article class="result-card">
              <div class="result-card-heading">
                <div>
                  <span class="result-emoji" aria-hidden="true">😊</span>
                  <h2>만족</h2>
                </div>
                <div class="result-number">
                  <strong id="satisfied-count">0</strong>
                  <span id="satisfied-rate">0%</span>
                </div>
              </div>
              <div class="bar-track" aria-hidden="true">
                <div id="satisfied-bar" class="bar-fill bar-satisfied"></div>
              </div>
            </article>

            <article class="result-card">
              <div class="result-card-heading">
                <div>
                  <span class="result-emoji" aria-hidden="true">😐</span>
                  <h2>보통</h2>
                </div>
                <div class="result-number">
                  <strong id="neutral-count">0</strong>
                  <span id="neutral-rate">0%</span>
                </div>
              </div>
              <div class="bar-track" aria-hidden="true">
                <div id="neutral-bar" class="bar-fill bar-neutral"></div>
              </div>
            </article>

            <article class="result-card">
              <div class="result-card-heading">
                <div>
                  <span class="result-emoji" aria-hidden="true">😞</span>
                  <h2>불만족</h2>
                </div>
                <div class="result-number">
                  <strong id="dissatisfied-count">0</strong>
                  <span id="dissatisfied-rate">0%</span>
                </div>
              </div>
              <div class="bar-track" aria-hidden="true">
                <div id="dissatisfied-bar" class="bar-fill bar-dissatisfied"></div>
              </div>
            </article>
          </div>

          <p id="admin-message" class="status-message" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <dialog id="login-dialog" class="login-dialog" aria-labelledby="login-title">
      <form id="login-form" class="login-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">ADMIN ONLY</p>
            <h2 id="login-title">관리자 로그인</h2>
          </div>
          <button id="close-login-button" class="icon-button" type="button" aria-label="닫기">×</button>
        </div>

        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <p id="login-message" class="form-message" role="alert" aria-live="assertive"></p>
        <button id="login-button" class="button button-primary button-full" type="submit">로그인</button>
      </form>
    </dialog>

    <noscript>이 웹앱을 사용하려면 JavaScript를 활성화해 주세요.</noscript>
  </body>
</html>
